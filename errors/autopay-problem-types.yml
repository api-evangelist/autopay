generated: '2026-09-06'
method: searched
source: https://developer.autopay.io/ — the "Error handling" section published on every API reference page
format: custom-json
rfc9457: false
description: >-
  Autopay publishes a per-API error reference on every page of developer.autopay.io. Errors
  are returned as a flat JSON object keyed on a stable string `error_id`, not as RFC 9457
  problem+json, and the documented HTTP status is carried separately. Only the Payment API
  page states an HTTP status per error id; the other pages document the id and its
  explanation without a status. Every entry below is transcribed verbatim from the
  provider's own error table — nothing here is inferred.
envelope:
  media_type: application/json
  fields:
  - name: error_id
    type: string
    required: true
    description: Specific code of error. Stable string identifier; the field agents should branch on.
  - name: message
    type: string
    required: true
    description: Description of error.
  - name: description
    type: string
    required: false
    description: Optional value. Additional description of error.
  example: |-
    {
      "error_id": "authentication_error",
      "message": "No access token present in header!"
    }
  note: >-
    The Authentication service (api-auth.autopay.io) uses a DIFFERENT envelope — the OAuth 2.0
    shape {"error": "...", "error_description": "..."} per RFC 6749 — not error_id/message.
    An agent must handle both.
observed_statuses:
- status: 200
  note: Documented success for every operation in the reference.
- status: 400
  note: Documented on the Payment API for missing_property, message_not_readable, method_not_supported, argument_type_mismatch, server_communication_error, operator_not_found_error and missing_operator_token_error.
- status: 401
  note: Returned by api.autopay.io on any request with no access token, and by the Auth0 token endpoint for invalid client credentials. Observed live 2026-09-06 on GET https://api.autopay.io/ -> {"error_id":"authentication_error","message":"No access token present in header!"}.
- status: 403
  note: Documented on the Payment API for the `forbidden` error id.
- status: 500
  note: Documented on the Payment API for `internal_server_error`.
shared_error_ids:
- id: forbidden
  title: Unauthorized
  http_status: 403
  scope: all APIs
  remediation: The token is missing, expired or lacks the scope for this API. Mint a new token via POST https://api-auth.autopay.io/oauth/token with the client credentials issued for this operator.
- id: internal_server_error
  title: Internal server error
  http_status: 500
  scope: all APIs
  remediation: Retry with exponential backoff; contact partner-support@autopay.io if it persists.
- id: message_not_readable
  title: A problem with the request body
  http_status: 400
  scope: most APIs
  remediation: Send a well-formed JSON body with Content-Type application/json.
- id: method_not_supported
  title: Used REST method not supported
  http_status: 400
  scope: most APIs
- id: missing_property
  title: A required property in request is missing
  http_status: 400
  scope: accounting, customer club, payment, price, statistics, status, vehicle
- id: argument_type_mismatch
  title: A request argument is of incorrect type
  http_status: 400
  scope: accounting, booking, customer club, payment, statistics, status, vehicle
- id: operator_not_found_error
  title: Operator not found
  scope: accounting, customer club, statistics, status, vehicle, payment
- id: missing_operator_token_error
  title: Your access token is missing an operator context — typically a credentials configuration issue.
  http_status: 400
  scope: booking, payment, vehicle
- id: server_communication_error
  title: Error communication with server
  http_status: 400
  scope: booking, payment, price
  note: On the Payment API this is also the id returned when a parking session is already linked to an external payment provider ("Payment provider already registered").
- id: authentication_error
  title: There is a problem with authentication (e.g. "Authorization required")
  http_status: 401
  scope: customer club; also the id returned by api.autopay.io for any unauthenticated request
- id: cursor_decoding_error
  title: Failed to decode cursor / Invalid cursor.
  scope: fleet, statistics
  remediation: Do not construct cursors. Replay the opaque `cursor` value returned by the previous page verbatim.
