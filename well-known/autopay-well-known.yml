source: live GET probes of /.well-known/* on every host this record knows
description: >-
  Probe of the RFC 8615 well-known namespace on every Autopay host in this record — the
  registrable domain and www, the API host, the authorization host named by the
  authentication docs, the developer portal, and the corporate site. Two documents are
  really served: an RFC 9116 security.txt on autopay.io and an OpenID Connect discovery
  document on api-auth.autopay.io. Everything else is a recorded absence.
notes:
  - >-
    autopay.io (and www) is a single-page app whose catch-all answers HTTP 200 with the
    same 1,913-byte HTML shell for every unknown path, including every /.well-known/*
    path. Those 200s are recorded below as soft-404 misses, not as documents. Only
    security.txt returns real text/plain content on that host.
  - >-
    api.autopay.io answers 401 {"error_id":"authentication_error"} on every path,
    including /.well-known/* — the API host requires a bearer token before routing.
  - >-
    api-auth.autopay.io is the Auth0-hosted authorization server named by
    https://developer.autopay.io/authentication/. Its openid-configuration is anonymous
    and real; every other well-known path on that host returns 403.
  - >-
    autopay.no does not serve HTTPS and its HTTP root is a registrar parking page
    ("autopay.no is parked"), so it was not probed for well-known documents.
