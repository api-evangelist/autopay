specification: API Commons Plans
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/Plans
provider: Autopay
providerId: autopay
generated: '2026-09-06'
method: searched
source: >-
  https://developer.autopay.io/ (per-API access requirements) and
  https://solutions.autopay.io/ (no pricing page exists — /pricing returns the site's 404)
created: '2026-05-04'
modified: '2026-09-06'
tags:
  - Parking
  - Parking Payments
  - Fleet Management
  - Permits
  - Parking Operators
  - Norway
description: >-
  Autopay publishes NO API pricing. Access to the developer APIs is sold, not self-served —
  several reference pages state plainly that the API "is offered as a paid service" and direct
  the reader to an Autopay representative, and the corporate site has no pricing page at all.
  This file records that finding.
plan_count: 0
plans: []
pricing_model: contact-sales
self_serve_signup: false
findings:
  - api: Accounting API
    quote: 'Access to the Accounting API is offered as a paid service. Please contact your Autopay representative for details'
    url: https://developer.autopay.io/accounting/
  - api: Booking API
    quote: 'Access to the Booking API is offered as a paid service. Please contact your Autopay representative for details'
    url: https://developer.autopay.io/booking_api/
  - api: Parking API
    quote: 'Access to the Parking API is offered as a paid service. Please contact your Autopay representative for details.'
    url: https://developer.autopay.io/parking_api/
  - api: Fleet API
    quote: >-
      'Fleet is a paid service. Getting a fleet company profile is manually handled. Please get
      in touch with your Autopay representative or sales@autopay.io for more information.'
    url: https://developer.autopay.io/fleet-api/
    note: >-
      The Fleet API also gates one capability behind a tier NAME without publishing the tier —
      the service webhook requires "a fleet company profile on the level Enterprise".
  - api: Payment API
    quote: 'Request access. Contact your Autopay representative and request Payment API access for one or more operators.'
    url: https://developer.autopay.io/payment_api/
probes:
  - url: https://solutions.autopay.io/pricing
    status: 404
    checked: '2026-09-06'
    note: Returns the Squarespace 404 page titled "404 — Autopay Technologies"; no pricing page is linked from the site navigation.
tiers_named_without_prices:
  - name: Enterprise
    context: Fleet company profile level required to use the Fleet service webhook.
    price: not published
note: >-
  This file previously carried a three-tier Free/Professional/Enterprise scaffold with invented
  request quotas and rate limits, written by the 2026-05-04 bulk sweep and never sourced from
  Autopay. Those numbers were not published by Autopay and have been removed. plan_count: 0 is
  the measured, correct value.
maintainers:
